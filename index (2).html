<style>
/* Layout: ein Fenster im Stil von Windows 98 auf türkisem Desktop: Titelleiste, Menü, Werkzeugkasten links, Zeichenfläche, Farbfeld, Statusleiste */
:root{--desk:#008080;--face:#c0c0c0;--navy:#000080;--sky:#1084d0;--ws:#808080;--font:Arial,Helvetica,"Liberation Sans",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:#000;font:15px/1.2 var(--font);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:none}
button,select,label{font:inherit;color:#000}
button{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:1px dotted #000;outline-offset:-4px}
[hidden]{display:none!important}
.raised{background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.sunk{box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000}
.thin{box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
#win{height:100%;display:flex;flex-direction:column;padding:3px;gap:3px}
#title{display:flex;align-items:center;gap:6px;height:30px;padding:2px 3px 2px 5px;background:linear-gradient(90deg,var(--navy),var(--sky));color:#fff;font-weight:700;flex:none}
#title .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{width:22px;height:20px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#000;flex:none;pointer-events:none}
#menubar{display:flex;flex-wrap:wrap;align-items:center;flex:none}
#menubar button{background:transparent;border:0;padding:0 12px;height:38px}
#menubar button.open{box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
#menubar .sp{flex:1}
#undoBtn{background:var(--face)!important;box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;margin-right:4px}
#tbar{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:3px 6px}
#tbar select{height:32px;min-width:0;border:0;background:#fff;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;padding:0 4px}
#tbar .ob{width:36px;height:32px;font-size:16px}
#main{flex:1;min-height:0;display:flex;gap:3px}
#tools{flex:none;width:92px;display:flex;flex-direction:column;gap:6px;padding:4px;overflow-y:auto}
#toolgrid{display:grid;grid-template-columns:1fr 1fr}
.tb{height:40px;display:grid;place-items:center;border:0;padding:0;background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.tb[aria-pressed=true]{background:conic-gradient(#fff 25%,#c0c0c0 0 50%,#fff 0 75%,#c0c0c0 0) 0 0/2px 2px;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000}
.tb svg{width:24px;height:24px;display:block}
#opts{padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--face);min-height:60px}
.orow{display:grid;gap:2px}
.orow.c1{grid-template-columns:1fr}.orow.c2{grid-template-columns:1fr 1fr}.orow.c3{grid-template-columns:1fr 1fr 1fr}.orow.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.ob{height:30px;min-width:0;border:0;background:transparent;display:grid;place-items:center;color:#000;padding:0;overflow:hidden}
.ob[aria-pressed=true]{background:var(--navy);color:#fff}
.ob i{display:block;background:currentColor}
.step{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;text-align:center;margin-top:2px}
.step button{height:30px;border:0;padding:0;background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;font-weight:700;font-size:17px}
#ws{flex:1;min-width:0;overflow:auto;background:var(--ws);padding:6px 24px 24px 6px;-webkit-overflow-scrolling:touch}
#sheet{position:relative}
#sheet canvas{display:block}
#cv{background:#fff;touch-action:none;cursor:crosshair}
#ov{position:absolute;left:0;top:0;pointer-events:none}

.rh{position:absolute;width:8px;height:8px;margin:-1px 0 0 -1px;background:var(--navy);touch-action:none}
.rh::after{content:"";position:absolute;inset:-14px}
#rhe{cursor:ew-resize}#rhs{cursor:ns-resize}#rhse{cursor:nwse-resize}
#rubber{position:absolute;border:1px dashed #000;pointer-events:none}
.sh{position:absolute;width:12px;height:12px;background:var(--navy);margin:-6px 0 0 -6px;touch-action:none;border:1px solid #fff}

.sh[data-h=nw],.sh[data-h=se]{cursor:nwse-resize}.sh[data-h=ne],.sh[data-h=sw]{cursor:nesw-resize}.sh[data-h=n],.sh[data-h=s]{cursor:ns-resize}.sh[data-h=e],.sh[data-h=w]{cursor:ew-resize}
.sh[data-h=nw]{left:0;top:0}.sh[data-h=n]{left:50%;top:0}.sh[data-h=ne]{left:100%;top:0}.sh[data-h=e]{left:100%;top:50%}.sh[data-h=se]{left:100%;top:100%}.sh[data-h=s]{left:50%;top:100%}.sh[data-h=sw]{left:0;top:100%}.sh[data-h=w]{left:0;top:50%}
#textbox{position:absolute;border:1px dashed #000}

#bottom{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:3px}

#cur button{position:absolute;width:26px;height:26px;border:0;padding:0}

#curfg{left:4px;top:4px;background:#000;z-index:1}
#cur button[aria-pressed=true]{outline:2px solid #ff0;outline-offset:1px}
#pal{flex:1 1 300px;min-width:0;max-width:520px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr))}
.sw{height:30px;border:0;padding:0;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
.sw span{display:block;height:100%;margin:2px;box-shadow:inset 1px 1px #000,inset -1px -1px #dfdfdf}
#status{display:flex;gap:3px;flex:none}

#st1{flex:1}#st2{width:110px}#st3{width:110px}
#dd{position:fixed;z-index:50;min-width:260px;max-width:calc(100vw - 16px);max-height:calc(100% - 60px);overflow:auto;padding:3px}
#dd button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:0 24px;height:40px;align-items:center}
#dd button:active,#dd button:hover{background:var(--navy);color:#fff}
#dd button:disabled{color:#808080;text-shadow:1px 1px #fff;background:transparent}
#dd hr{border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:3px 2px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.3);display:grid;place-items:center;padding:16px}
.dlg{width:min(460px,100%);max-height:100%;overflow:auto;padding:3px}
.dlg h2{margin:0;font-size:15px;height:28px;display:flex;align-items:center;padding:0 6px;background:linear-gradient(90deg,var(--navy),var(--sky));color:#fff}
.dlg .bd{padding:12px;line-height:1.4}
.dlg p{margin:0 0 8px}

.cgrid button{height:30px;border:0;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;padding:0}
.cgrid button[aria-pressed=true]{outline:2px solid #000;outline-offset:1px}
#custom{position:relative;flex:none;height:44px;padding:0 10px;display:grid;place-items:center;text-align:center;line-height:1.1}

html,body{touch-action:none}
#ws,#tools,.dlg,#dd,#chips{touch-action:pan-x pan-y}
#layers{position:absolute;left:0;top:0;overflow:hidden;pointer-events:none}
.lay{position:absolute;pointer-events:none;transform-origin:50% 50%}

#zoombox{flex:none;display:flex;align-items:center;gap:4px;margin-left:auto}

#zoomr::-moz-range-thumb{width:22px;height:32px;border:0;border-radius:0;background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}

/* Speicher im Browser (IndexedDB): Bild und Bildebenen bleiben nach dem Schließen erhalten */
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('omas-paint-2',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function idbPut(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function autosave(){
  try{
    var ls=layers.slice();
    Promise.all([toBlobP(cv)].concat(ls.map(function(l){return toBlobP(l.c)}))).then(function(b){
      if(!b[0])return;
      return idbPut('doc',{name:S.name,base:b[0],layers:ls.map(function(l,i){return {blob:b[i+1],cx:l.cx,cy:l.cy,w:l.w,h:l.h,a:l.a,name:l.name}})});
    }).catch(function(){});
  }catch(e){}
}
function touch(){S.dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(autosave,1500)}

/* Rückgängig: speichert nur die geänderten Bildteile, darum sehr viele Schritte möglich */
function addHist(e){
  hist.push(e);histBytes+=e.bytes;redoH=[];
  while(hist.length>1000||histBytes>260e6){histBytes-=hist.shift().bytes}
  touch();
}
function afterHist(){
  if(active&&layers.indexOf(active)<0)active=null;
  renderStrip();placeAll();touch();
}
function undo(){
  commitText();cancelShapes();commitSel();
  if(!hist.length){setStatus('Es gibt nichts mehr zum Rückgängigmachen.');return}
  var e=hist.pop();histBytes-=e.bytes;e.undo();redoH.push(e);afterHist();
}
function redo(){
  commitText();cancelShapes();commitSel();
  if(!redoH.length)return;
  var e=redoH.pop();e.redo();hist.push(e);histBytes+=e.bytes;afterHist();
}
function resetHist(){hist=[];redoH=[];histBytes=0}
function opBegin(cnv,L){return {cnv:cnv,L:L||null,pre:tget(cnv).getImageData(0,0,cnv.width,cnv.height)}}
function cropData(src,x,y,w,h){
  var o=new ImageData(w,h),sw=src.width,i;
  for(i=0;i<h;i++)o.data.set(src.data.subarray(((y+i)*sw+x)*4,((y+i)*sw+x+w)*4),i*w*4);
  return o;
}
function opEnd(r){
  var c=r.cnv;if(c.width!==r.pre.width||c.height!==r.pre.height)return null;
  var cur=tget(c).getImageData(0,0,c.width,c.height),w=c.width,h=c.height;
  var a=new Uint32Array(r.pre.data.buffer),b=new Uint32Array(cur.data.buffer),x0=w,y0=h,x1=-1,y1=-1,x,y,row;
  for(y=0;y<h;y++){row=y*w;for(x=0;x<w;x++){if(a[row+x]!==b[row+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}}
  if(x1<0)return null;
  var bw=x1-x0+1,bh=y1-y0+1,before=cropData(r.pre,x0,y0,bw,bh),after=cropData(cur,x0,y0,bw,bh),L=r.L;
  function cn(){return L?L.c:cv}
  return {bytes:bw*bh*8+64,undo:function(){tget(cn()).putImageData(before,x0,y0);if(L)thumbFor(L)},redo:function(){tget(cn()).putImageData(after,x0,y0);if(L)thumbFor(L)}};
}
function snapDoc(){return {w:cv.width,h:cv.height,img:ctx.getImageData(0,0,cv.width,cv.height)}}
function setDoc(d){if(d.w!==cv.width||d.h!==cv.height)setSize(d.w,d.h);ctx.putImageData(d.img,0,0)}
function histFull(before){var after=snapDoc();addHist({bytes:before.img.data.length+after.img.data.length,undo:function(){setDoc(before)},redo:function(){setDoc(after)}})}
function lstate(L){return {c:L.c,cx:L.cx,cy:L.cy,w:L.w,h:L.h,a:L.a}}
function setL(L,s){L.c=s.c;L.cx=s.cx;L.cy=s.cy;L.w=s.w;L.h=s.h;L.a=s.a;mountLayer(L)}
function histLayer(L,before){
  var after=lstate(L),by=before.c!==after.c?(before.c.width*before.c.height+after.c.width*after.c.height)*4:80;
  addHist({bytes:by,undo:function(){setL(L,before)},redo:function(){setL(L,after)}});
}

/* Bildebenen */
function mountLayer(L){
  if(L.el!==L.c){if(L.el&&L.el.parentNode)L.el.parentNode.replaceChild(L.c,L.el);L.el=L.c;L.c.className='lay'}
  if(!L.el.parentNode)layersEl.appendChild(L.el);
  placeItem(L);thumbFor(L);
}
function syncOrder(){layers.forEach(function(l){layersEl.appendChild(l.el)});if(sel&&sel.view)layersEl.appendChild(sel.view)}
function insertLayer(L,idx){layers.splice(Math.min(idx,layers.length),0,L);mountLayer(L);syncOrder();renderStrip()}
function removeLayer(L){
  var i=layers.indexOf(L);if(i<0)return -1;
  layers.splice(i,1);if(L.el.parentNode)L.el.parentNode.removeChild(L.el);
  if(active===L){active=null;updateFrames()}
  renderStrip();return i;
}
function moveLayer(L,to){
  var i=layers.indexOf(L);if(i<0)return;
  to=Math.max(0,Math.min(layers.length-1,to));if(to===i)return;
  layers.splice(i,1);layers.splice(to,0,L);syncOrder();renderStrip();
  addHist({bytes:64,undo:function(){moveLayer0(L,i)},redo:function(){moveLayer0(L,to)}});
}
function moveLayer0(L,to){var i=layers.indexOf(L);if(i<0)return;layers.splice(i,1);layers.splice(to,0,L);syncOrder();renderStrip()}
function delLayer(L){
  if(!L)return;commitText();commitSel();
  var i=removeLayer(L);if(i<0)return;
  addHist({bytes:L.c.width*L.c.height*4,undo:function(){insertLayer(L,i)},redo:function(){removeLayer(L)}});
  setStatus('Bild entfernt. Rückgängig holt es zurück.');
}
function addLayerHist(L,i){addHist({bytes:L.c.width*L.c.height*4,undo:function(){removeLayer(L)},redo:function(){insertLayer(L,i)}})}
function placeItem(it){
  if(!it.el)return;var z=S.zoom,s=it.el.style;
  s.left=((it.cx-it.w/2)*z)+'px';s.top=((it.cy-it.h/2)*z)+'px';s.width=(it.w*z)+'px';s.height=(it.h*z)+'px';
  s.transform=Math.abs(it.a)<1e-6?'none':'rotate('+it.a+'rad)';
  var src=it.c||it.src,crisp=Math.abs(it.a)<1e-6&&src&&it.w===src.width&&z>=1;
  s.imageRendering=crisp?'pixelated':'auto';
}
function setActive(L,quiet){
  commitText();commitSel();
  active=L;renderStrip();updateFrames();
  if(!quiet)setStatus(L?'Bearbeitet wird: '+L.name+'. Malen und Radieren wirkt nur auf dieses Bild.':'Bearbeitet wird: Hintergrund.');
}
/* Ziel für Zeichenwerkzeuge: das gewählte Bild oder der Hintergrund */
function bake(L){
  if(!L)return;
  if(Math.abs(L.a)<1e-6&&L.w===L.c.width&&L.h===L.c.height&&L.w%1===0&&L.h%1===0&&(L.cx-L.w/2)%1===0&&(L.cy-L.h/2)%1===0)return;
  var before=lstate(L),cs=Math.cos(L.a),sn=Math.sin(L.a);
  var Wb=Math.max(1,Math.ceil(Math.abs(L.w*cs)+Math.abs(L.h*sn)-1e-6)),Hb=Math.max(1,Math.ceil(Math.abs(L.w*sn)+Math.abs(L.h*cs)-1e-6));
  var n=newCanvas(Wb,Hb),g=n.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';
  g.translate(Wb/2,Hb/2);g.rotate(L.a);g.drawImage(L.c,-L.w/2,-L.h/2,L.w,L.h);
  var left=Math.round(L.cx-Wb/2),top=Math.round(L.cy-Hb/2);
  L.c=n;L.w=Wb;L.h=Hb;L.a=0;L.cx=left+Wb/2;L.cy=top+Hb/2;mountLayer(L);histLayer(L,before);
}
function tgt(){
  if(active){bake(active);return {L:active,cnv:active.c,g:tget(active.c),ox:Math.round(active.cx-active.w/2),oy:Math.round(active.cy-active.h/2)}}
  return {L:null,cnv:cv,g:ctx,ox:0,oy:0};
}
function dBegin(){D=tgt();D.rec=opBegin(D.cnv,D.L);D.g.save();D.g.setTransform(1,0,0,1,-D.ox,-D.oy)}
function dEnd(){
  if(!D)return;D.g.restore();var e=opEnd(D.rec);if(e)addHist(e);var L=D.L;D=null;
  if(L)thumbFor(L);else thumbBase();
}
function dAbort(){
  if(!D)return;D.g.restore();tget(D.cnv).putImageData(D.rec.pre,0,0);if(D.L)thumbFor(D.L);D=null;
}
function composeTo(g){
  g.drawImage(cv,0,0);
  layers.forEach(function(L){g.save();g.imageSmoothingQuality='high';g.translate(L.cx,L.cy);g.rotate(L.a);g.drawImage(L.c,-L.w/2,-L.h/2,L.w,L.h);g.restore()});
}
function compose(){commitText();commitSel();var c=newCanvas(cv.width,cv.height);composeTo(c.getContext('2d'));return c}
function flattenAll(){
  if(!layers.length)return;
  commitText();commitSel();
  var bi=snapDoc(),bl=layers.slice(),bs=bl.map(lstate),bytes=bi.img.data.length;
  bl.forEach(function(l){bytes+=l.c.width*l.c.height*4});
  var tmp=newCanvas(cv.width,cv.height),g=tmp.getContext('2d');composeTo(g);
  ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(tmp,0,0);
  bl.forEach(function(l){if(l.el.parentNode)l.el.parentNode.removeChild(l.el)});
  layers=[];active=null;renderStrip();updateFrames();
  var ai=snapDoc();
  addHist({bytes:bytes+ai.img.data.length,
    undo:function(){setDoc(bi);layers=bl.slice();bl.forEach(function(l,i){setL(l,bs[i])});syncOrder();renderStrip()},
    redo:function(){setDoc(ai);layers.forEach(function(l){if(l.el.parentNode)l.el.parentNode.removeChild(l.el)});layers=[];active=null;renderStrip();updateFrames()}});
  setStatus('Alle Bilder wurden mit dem Hintergrund zusammengefügt.');
}

function layout(){
  var z=S.zoom,W=cv.width*z,H=cv.height*z;
  [cv,ov,layersEl].forEach(function(e){e.style.width=W+'px';e.style.height=H+'px'});
  sheet.style.width=W+'px';sheet.style.height=H+'px';
  cv.style.imageRendering=z>=2?'pixelated':'auto';ov.style.imageRendering=cv.style.imageRendering;
  var g=$('#grid');g.hidden=!(S.grid&&z>=4);
  if(!g.hidden){g.style.width=W+'px';g.style.height=H+'px';g.style.backgroundSize=z+'px '+z+'px'}
  $('#rhe').style.left=W+'px';$('#rhe').style.top=(H/2)+'px';
  $('#rhs').style.left=(W/2)+'px';$('#rhs').style.top=H+'px';
  $('#rhse').style.left=W+'px';$('#rhse').style.top=H+'px';
  placeAll();layoutText();syncZoomUI();
  if(!sel)$('#st3').textContent=cv.width+' × '+cv.height;

function fitZoom(){return Math.max(ZMIN,Math.min(Z1,(ws.clientWidth-34)/cv.width,(ws.clientHeight-34)/cv.height))}
function setZoom(z,center,quiet){
  commitText();z=Math.max(ZMIN,Math.min(ZMAX,z));
  var r=ws.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  var cx=center?center.x:((r.left+r.width/2-cr.left)/S.zoom),cy=center?center.y:((r.top+r.height/2-cr.top)/S.zoom);
  S.zoom=z;layout();
  ws.scrollLeft=Math.max(0,cx*z-ws.clientWidth/2+6);ws.scrollTop=Math.max(0,cy*z-ws.clientHeight/2+6);
  if(!quiet)setStatus('Ansicht: '+Math.round(z/Z1*100)+' %');

function syncZoomUI(){

  dBegin();D.g.fillStyle=S.bg;D.g.fillRect(0,0,cv.width,cv.height);dEnd();thumbBase();
}
var openMenu=null;
function closeMenu(){var d=$('#dd');d.hidden=true;d.innerHTML='';document.querySelectorAll('#menubar .open').forEach(function(b){b.classList.remove('open')});openMenu=null}
document.querySelectorAll('#menubar [data-menu]').forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.dataset.menu;if(openMenu===k){closeMenu();return}
    closeMenu();commitText();cancelCurve();openMenu=k;b.classList.add('open');
    var d=$('#dd');d.innerHTML='';
    menus[k]().forEach(function(it){
      if(it[0]==='-'){d.appendChild(document.createElement('hr'));return}
      var x=document.createElement('button');x.type='button';x.textContent=it[0];x.disabled=!!it[2];
      x.addEventListener('click',function(){closeMenu();it[1]()});d.appendChild(x);
    });
    var r=b.getBoundingClientRect();d.hidden=false;
    d.style.left=Math.max(8,Math.min(r.left,window.innerWidth-d.offsetWidth-8))+'px';d.style.top=r.bottom+'px';
  });
});
document.addEventListener('pointerdown',function(e){if(openMenu&&!e.target.closest('#dd')&&!e.target.closest('#menubar'))closeMenu()},true);
$('#undoBtn').addEventListener('click',undo);
$('#curfg').addEventListener('click',function(){S.target='fg';showColors()});
$('#curbg').addEventListener('click',function(){S.target='bg';showColors()});

/* Bildleiste und Zoom-Regler */
$('#lFront').addEventListener('click',function(){if(active)moveLayer(active,layers.length-1)});
$('#lBack').addEventListener('click',function(){if(active)moveLayer(active,0)});
$('#lDel').addEventListener('click',function(){if(active)delLayer(active)});
$('#lMerge').addEventListener('click',flattenAll);
(function(){
  var r=$('#zoomr'),pend=0;
  r.addEventListener('input',function(){
    var v=+r.value;if(pend)cancelAnimationFrame(pend);
    pend=requestAnimationFrame(function(){pend=0;var z=tToZ(v);if(Math.abs(z-Z1)<0.04*Z1)z=Z1;setZoom(z,null,true)});
  });
  $('#zOut').addEventListener('click',function(){setZoom(S.zoom/1.25)});
  $('#zIn').addEventListener('click',function(){setZoom(S.zoom*1.25)});
  $('#zVal').addEventListener('click',function(){setZoom(Z1)});
})();

/* Textleiste */
(function(){
  var ss=$('#sizesel');[8,9,10,11,12,14,16,18,20,22,24,26,28,36,48,72].forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;if(n===S.fsize)o.selected=true;ss.appendChild(o)});

/* Tastatur und Einfügen */
document.addEventListener('keydown',function(e){
  var tg=e.target;
  if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT')){if(e.key==='Escape'&&tg===tarea)commitText();return}
  if(!$('#modal').hidden)return;
  var k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
  if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(m&&k==='y'){e.preventDefault();redo()}
  else if(m&&k==='a'){e.preventDefault();selAll()}
  else if(m&&k==='c'){e.preventDefault();copySel()}
  else if(m&&k==='x'){e.preventDefault();cutSel()}
  else if(m&&k==='s'){e.preventDefault();doSave(S.name,'png')}
  else if(k==='delete'||k==='backspace'){if(sel){e.preventDefault();delSel()}else if(active&&S.tool==='move'){e.preventDefault();delLayer(active)}}
  else if(k==='escape'){if(poly)commitPoly();cancelCurve();commitSel()}
});
document.addEventListener('paste',function(e){
  if(!$('#modal').hidden)return;var tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;
  var items=(e.clipboardData&&e.clipboardData.files)||[];
  for(var i=0;i<items.length;i++){
    if(/^image\//.test(items[i].type)){e.preventDefault();loadImg(items[i]).then(function(im){addImageLayer(imgToCanvas(im,IMGMAX),null,0)});return}
  }
  if(clip){e.preventDefault();pasteClip()}
});
window.addEventListener('resize',layout);

/* Start */
/* Miniaturansicht (wie in Paint unter Windows XP) */
(function(){
  var tc=$('#thumb'),tg=tc.getContext('2d'),pend=0,tmr=0;
  function draw(){
    pend=0;if(!S.thumb)return;
    var k=Math.min(190/cv.width,140/cv.height,1),w=Math.max(20,Math.round(cv.width*k)),h=Math.max(20,Math.round(cv.height*k));
    if(tc.width!==w||tc.height!==h){tc.width=w;tc.height=h}
    tg.setTransform(1,0,0,1,0,0);tg.fillStyle='#fff';tg.fillRect(0,0,w,h);
    tg.save();tg.scale(w/cv.width,h/cv.height);tg.imageSmoothingQuality='medium';composeTo(tg);tg.restore();
    var vx=ws.scrollLeft/S.zoom,vy=ws.scrollTop/S.zoom,vw=ws.clientWidth/S.zoom,vh=ws.clientHeight/S.zoom;
    if(vw<cv.width||vh<cv.height){
      var sx=w/cv.width,sy=h/cv.height;tg.lineWidth=2;tg.strokeStyle='#e00';
      tg.strokeRect(vx*sx+1,vy*sy+1,Math.max(4,Math.min(vw,cv.width)*sx-2),Math.max(4,Math.min(vh,cv.height)*sy-2));
    }
  }
  function soon(){if(!pend)pend=requestAnimationFrame(draw)}
  window.thumbRefresh=function(){
    tc.hidden=!S.thumb;clearInterval(tmr);
    if(S.thumb){soon();tmr=setInterval(soon,500)}
  };
  ws.addEventListener('scroll',function(){if(S.thumb)soon()});
  function go(e){
    var r=tc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*cv.width,y=(e.clientY-r.top)/r.height*cv.height;
    ws.scrollLeft=Math.max(0,x*S.zoom-ws.clientWidth/2);ws.scrollTop=Math.max(0,y*S.zoom-ws.clientHeight/2);
  }
  var dn=false;
  tc.addEventListener('pointerdown',function(e){e.preventDefault();dn=true;try{tc.setPointerCapture(e.pointerId)}catch(x){}go(e)});
  tc.addEventListener('pointermove',function(e){if(dn)go(e)});
  tc.addEventListener('pointerup',function(){dn=false});tc.addEventListener('pointercancel',function(){dn=false});
})();
buildTools();buildPalette();showColors();chooseTool('pencil');applyView();
function startBlank(){
  setSize(Math.max(300,Math.floor((ws.clientWidth-34)*DPR)),Math.max(240,Math.floor((ws.clientHeight-34)*DPR)));S.zoom=Z1;layout();fillWith('#ffffff');S.dirty=false;
}
startBlank();
function loadBlob(b){return new Promise(function(res,rej){var u=URL.createObjectURL(b),im=new Image();im.onload=function(){URL.revokeObjectURL(u);var c=newCanvas(im.naturalWidth,im.naturalHeight);c.getContext('2d',{willReadFrequently:true}).drawImage(im,0,0);res(c)};im.onerror=function(){URL.revokeObjectURL(u);rej()};im.src=u})}
idbGet('doc').then(function(rec){
  if(rec&&rec.base)return loadBlob(rec.base).then(function(c){
    S.zoom=Z1;setSize(c.width,c.height);ctx.drawImage(c,0,0);
    if(rec.name){S.name=rec.name;setTitle()}
    return Promise.all((rec.layers||[]).map(function(l){return loadBlob(l.blob).then(function(lc){return {lc:lc,l:l}})}));
  }).then(function(arr){
    arr.forEach(function(o){layerSeq++;var lc=o.lc;lc.className='lay';var L={name:o.l.name||('Bild '+layerSeq),c:lc,cx:o.l.cx,cy:o.l.cy,w:o.l.w,h:o.l.h,a:o.l.a,el:null};insertLayer(L,layers.length)});
    var z=fitZoom();if(z<Z1){S.zoom=z}layout();renderStrip();S.dirty=false;
  });
  return idbGet('img').then(function(r2){
    if(!r2||!r2.blob)return;
    return loadBlob(r2.blob).then(function(c){S.zoom=Z1;setSize(c.width,c.height);ctx.drawImage(c,0,0);var z=fitZoom();if(z<Z1){S.zoom=z;layout()}if(r2.name){S.name=r2.name;setTitle()}S.dirty=false});
  });
}).catch(function(){});
})();
