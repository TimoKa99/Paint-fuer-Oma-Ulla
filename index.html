<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Omas Paint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: ein Fenster im Stil von Windows 98 auf türkisem Desktop: Titelleiste, Menü, Werkzeugkasten links, Zeichenfläche, Farbfeld, Statusleiste */
:root{--desk:#008080;--face:#c0c0c0;--navy:#000080;--sky:#1084d0;--ws:#808080;--font:Arial,Helvetica,"Liberation Sans",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:#000;font:15px/1.2 var(--font);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}
button,select,label{font:inherit;color:#000;touch-action:manipulation}
button{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:1px dotted #000;outline-offset:-4px}
[hidden]{display:none!important}
.raised{background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.sunk{box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000}
.thin{box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
#win{height:100%;display:flex;flex-direction:column;padding:3px;gap:3px}
#title{display:flex;align-items:center;gap:6px;height:30px;padding:2px 3px 2px 5px;background:linear-gradient(90deg,var(--navy),var(--sky));color:#fff;font-weight:700;flex:none}
#title .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{width:22px;height:20px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#000;flex:none;pointer-events:none}
#menubar{display:flex;flex-wrap:wrap;align-items:center;flex:none}
#menubar button{background:transparent;border:0;padding:0 12px;height:38px}
#menubar button.open{box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
#menubar .sp{flex:1}
#undoBtn{background:var(--face)!important;box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;margin-right:4px}
#tbar{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:3px 6px}
#tbar select{height:32px;min-width:0;border:0;background:#fff;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;padding:0 4px}
#tbar .ob{width:36px;height:32px;font-size:16px}
#main{flex:1;min-height:0;display:flex;gap:3px}
#tools{flex:none;width:92px;display:flex;flex-direction:column;gap:6px;padding:4px;overflow-y:auto}
#toolgrid{display:grid;grid-template-columns:1fr 1fr}
.tb{height:40px;display:grid;place-items:center;border:0;padding:0;background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.tb[aria-pressed=true]{background:conic-gradient(#fff 25%,#c0c0c0 0 50%,#fff 0 75%,#c0c0c0 0) 0 0/2px 2px;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000}
.tb svg{width:24px;height:24px;display:block}
#opts{padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--face);min-height:60px}
.orow{display:grid;gap:2px}
.orow.c1{grid-template-columns:1fr}.orow.c2{grid-template-columns:1fr 1fr}.orow.c3{grid-template-columns:1fr 1fr 1fr}.orow.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.ob{height:30px;min-width:0;border:0;background:transparent;display:grid;place-items:center;color:#000;padding:0;overflow:hidden}
.ob[aria-pressed=true]{background:var(--navy);color:#fff}
.ob i{display:block;background:currentColor}
.step{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;text-align:center;margin-top:2px}
.step button{height:30px;border:0;padding:0;background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;font-weight:700;font-size:17px}
#ws{flex:1;min-width:0;overflow:auto;background:var(--ws);padding:6px 24px 24px 6px;-webkit-overflow-scrolling:touch}
#sheet{position:relative}
#sheet canvas{display:block}
#cv{background:#fff;touch-action:none;cursor:crosshair}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#grid{position:absolute;left:0;top:0;pointer-events:none;background-image:linear-gradient(to right,rgba(128,128,128,.55) 1px,transparent 1px),linear-gradient(to bottom,rgba(128,128,128,.55) 1px,transparent 1px)}
.rh{position:absolute;width:8px;height:8px;margin:-1px 0 0 -1px;background:var(--navy);touch-action:none}
.rh::after{content:"";position:absolute;inset:-14px}
#rhe{cursor:ew-resize}#rhs{cursor:ns-resize}#rhse{cursor:nwse-resize}
#rubber{position:absolute;border:1px dashed #000;pointer-events:none}
#selbox{position:absolute;border:1px dashed #000;outline:1px dashed #fff;outline-offset:-2px;touch-action:none;cursor:move}
#selbox canvas{display:block;width:100%;height:100%;pointer-events:none}
.sh{position:absolute;width:10px;height:10px;background:var(--navy);margin:-5px 0 0 -5px;touch-action:none}
.sh::after{content:"";position:absolute;inset:-13px}
.sh[data-h=nw],.sh[data-h=se]{cursor:nwse-resize}.sh[data-h=ne],.sh[data-h=sw]{cursor:nesw-resize}.sh[data-h=n],.sh[data-h=s]{cursor:ns-resize}.sh[data-h=e],.sh[data-h=w]{cursor:ew-resize}
.sh[data-h=nw]{left:0;top:0}.sh[data-h=n]{left:50%;top:0}.sh[data-h=ne]{left:100%;top:0}.sh[data-h=e]{left:100%;top:50%}.sh[data-h=se]{left:100%;top:100%}.sh[data-h=s]{left:50%;top:100%}.sh[data-h=sw]{left:0;top:100%}.sh[data-h=w]{left:0;top:50%}
#textbox{position:absolute;border:1px dashed #000}
#textarea{display:block;width:100%;height:100%;border:0;margin:0;padding:0;resize:none;outline:none;overflow:hidden;white-space:pre;-webkit-user-select:text;user-select:text;background:transparent}
#bottom{flex:none;display:flex;gap:8px;align-items:center;padding:3px}
#cur{position:relative;width:48px;height:44px;flex:none;background:var(--face)}
#cur button{position:absolute;width:26px;height:26px;border:0;padding:0}
#curbg{right:4px;bottom:4px;background:#fff}
#curfg{left:4px;top:4px;background:#000;z-index:1}
#cur button[aria-pressed=true]{outline:2px solid #ff0;outline-offset:1px}
#pal{flex:1;min-width:0;max-width:560px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr))}
.sw{height:30px;border:0;padding:0;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
.sw span{display:block;height:100%;margin:2px;box-shadow:inset 1px 1px #000,inset -1px -1px #dfdfdf}
#hint{font-size:12px;max-width:150px;line-height:1.25;color:#000}
#status{display:flex;gap:3px;flex:none}
#status span{padding:4px 6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{width:110px}#st3{width:110px}
#dd{position:fixed;z-index:50;min-width:260px;max-width:calc(100vw - 16px);max-height:calc(100% - 60px);overflow:auto;padding:3px}
#dd button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:0 24px;height:40px;align-items:center}
#dd button:active,#dd button:hover{background:var(--navy);color:#fff}
#dd button:disabled{color:#808080;text-shadow:1px 1px #fff;background:transparent}
#dd hr{border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:3px 2px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.3);display:grid;place-items:center;padding:16px}
.dlg{width:min(460px,100%);max-height:100%;overflow:auto;padding:3px}
.dlg h2{margin:0;font-size:15px;height:28px;display:flex;align-items:center;padding:0 6px;background:linear-gradient(90deg,var(--navy),var(--sky));color:#fff}
.dlg .bd{padding:12px;line-height:1.4}
.dlg p{margin:0 0 8px}
.dlg img{display:block;max-width:100%;max-height:50vh;margin:8px auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;background:#fff}
.dlg label{display:flex;align-items:center;gap:8px;margin:6px 0;min-height:30px}
.dlg input[type=radio]{width:20px;height:20px;margin:0}
.dlg input[type=number],.dlg input[type=text],.dlg select{width:120px;height:34px;font:inherit;border:0;padding:0 6px;background:#fff;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;-webkit-user-select:text;user-select:text}
.dlg input[type=number],.dlg input[type=text],.dlg select,#tbar select,#textarea{font-size:16px}
.dlg fieldset{border:1px solid #808080;box-shadow:1px 1px #fff;margin:0 0 10px;padding:6px 10px}
.dlg legend{padding:0 4px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;padding:0 12px 12px;flex-wrap:wrap}
.btn{min-width:92px;height:38px;border:0;padding:0 12px;background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.btn:active{box-shadow:inset -1px -1px #fff,inset 1px 1px #000,inset -2px -2px #dfdfdf,inset 2px 2px #808080}
.cgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:6px 0 10px}
.cgrid button{height:30px;border:0;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;padding:0}
.cgrid button[aria-pressed=true]{outline:2px solid #000;outline-offset:1px}
#custom{position:relative;flex:none;height:44px;padding:0 10px;display:grid;place-items:center;text-align:center;line-height:1.1}
@media (max-width:620px){#menubar button{padding:0 8px}#tools{width:80px}.tb{height:36px}#hint{display:none}}
</style>
</head>
<body>

<div id="win" class="raised">
  <div id="title">
    <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="3" width="18" height="14" fill="#fff" stroke="#000"/><path d="M4 14 L9 7 L12 11 L14 9 L17 14 Z" fill="#00a000"/><circle cx="6" cy="6.5" r="1.6" fill="#ff0"/></svg>
    <span class="t" id="titletext">Unbenannt - Paint</span>
    <span class="wb raised" aria-hidden="true">_</span><span class="wb raised" aria-hidden="true">□</span><span class="wb raised" aria-hidden="true">×</span>
  </div>
  <nav id="menubar" aria-label="Menü">
    <button type="button" data-menu="datei">Datei</button>
    <button type="button" data-menu="bearbeiten">Bearbeiten</button>
    <button type="button" data-menu="ansicht">Ansicht</button>
    <button type="button" data-menu="bild">Bild</button>
    <button type="button" data-menu="farben">Farben</button>
    <button type="button" data-menu="hilfe">Hilfe</button>
    <span class="sp"></span>
    <button type="button" id="undoBtn">↶ Rückgängig</button>
  </nav>
  <div id="tbar" class="raised" hidden>
    <select id="fontsel" aria-label="Schriftart">
      <option>Arial</option><option>Times New Roman</option><option>Courier New</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Comic Sans MS</option>
    </select>
    <select id="sizesel" aria-label="Schriftgröße"></select>
    <button type="button" class="ob raised" id="bBold" aria-pressed="false" aria-label="Fett"><b>F</b></button>
    <button type="button" class="ob raised" id="bItal" aria-pressed="false" aria-label="Kursiv"><i>K</i></button>
    <button type="button" class="ob raised" id="bUnder" aria-pressed="false" aria-label="Unterstrichen"><u>U</u></button>
  </div>
  <div id="main">
    <div id="tools" class="raised">
      <div id="toolgrid" role="toolbar" aria-label="Werkzeuge"></div>
      <div id="opts" class="sunk" aria-label="Werkzeugoptionen"></div>
    </div>
    <div id="ws" class="sunk">
      <div id="sheet">
        <canvas id="cv"></canvas>
        <div id="grid" hidden></div>
        <canvas id="ov"></canvas>
        <div id="selbox" hidden>
          <canvas id="selview"></canvas>
          <i class="sh" data-h="nw"></i><i class="sh" data-h="n"></i><i class="sh" data-h="ne"></i><i class="sh" data-h="e"></i><i class="sh" data-h="se"></i><i class="sh" data-h="s"></i><i class="sh" data-h="sw"></i><i class="sh" data-h="w"></i>
        </div>
        <div id="textbox" hidden><textarea id="textarea" aria-label="Text eingeben" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div>
        <div id="rubber" hidden></div>
        <i class="rh" id="rhe"></i><i class="rh" id="rhs"></i><i class="rh" id="rhse"></i>
      </div>
    </div>
  </div>
  <div id="bottom">
    <div id="cur" class="sunk">
      <button type="button" id="curbg" class="thin" aria-label="Hintergrundfarbe" aria-pressed="false"></button>
      <button type="button" id="curfg" class="thin" aria-label="Vordergrundfarbe" aria-pressed="true"></button>
    </div>
    <div id="pal" role="group" aria-label="Farben"></div>
    <div id="hint">Farbe lange drücken: Hintergrundfarbe. Zweimal tippen: Farbe ändern.</div>
  </div>
  <div id="status">
    <span id="st1" class="thin">Hilfe: Menü „Hilfe“ antippen.</span>
    <span id="st2" class="thin"></span>
    <span id="st3" class="thin"></span>
  </div>
</div>
<div id="dd" class="raised" hidden></div>
<div id="modal" hidden></div>
<input type="file" id="filein" accept="image/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var cv=$('#cv'),ov=$('#ov'),ctx=cv.getContext('2d',{willReadFrequently:true}),octx=ov.getContext('2d');
var sheet=$('#sheet'),ws=$('#ws'),selbox=$('#selbox'),selview=$('#selview'),tbox=$('#textbox'),tarea=$('#textarea');
var S={zoom:1,fg:'#000000',bg:'#ffffff',target:'fg',tool:'pencil',prev:'pencil',grid:false,dirty:false,name:'Unbenannt',fill:0,transparent:false,font:'Arial',fsize:12,bold:false,italic:false,under:false,lupe:4,showTools:true,showPal:true,showStatus:true};
var SZ={brush:{shape:'round',val:7},eraser:{val:10},spray:{val:14},line:{val:1}};
var MAXPIX=16e6,MAXDIM=8000;
var sel=null,textObj=null,poly=null,curve=null,useBg=false,pasteQueue=[],clip=null;
var undoSt=[],redoSt=[],saveTimer=0;

/* Hilfsfunktionen */
function setStatus(t){$('#st1').textContent=t}
function newCanvas(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function copyCanvas(){var c=newCanvas(cv.width,cv.height);c.getContext('2d').drawImage(cv,0,0);return c}
function hexRgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
function setTitle(){$('#titletext').textContent=S.name+' - Paint'}
function fillWith(c){ctx.fillStyle=c;ctx.fillRect(0,0,cv.width,cv.height)}

/* Speicher im Browser (IndexedDB), damit das Bild nach dem Schließen noch da ist */
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('omas-paint-2',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function idbPut(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function autosave(){try{cv.toBlob(function(b){if(b)idbPut('img',{blob:b,name:S.name}).catch(function(){})},'image/png')}catch(e){}}
function touch(){S.dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(autosave,1500)}

/* Rückgängig */
function maxUndo(){return Math.max(3,Math.min(30,Math.floor(80e6/(cv.width*cv.height*4))))}
function snap(){return ctx.getImageData(0,0,cv.width,cv.height)}
function pushUndo(){undoSt.push(snap());while(undoSt.length>maxUndo())undoSt.shift();redoSt=[];touch()}
function restore(img){if(img.width!==cv.width||img.height!==cv.height)setSize(img.width,img.height);ctx.putImageData(img,0,0);touch()}
function undo(){
  commitText();cancelShapes();commitSel();
  if(!undoSt.length){setStatus('Es gibt nichts zum Rückgängigmachen.');return}
  redoSt.push(snap());restore(undoSt.pop());
}
function redo(){
  commitText();cancelShapes();commitSel();
  if(!redoSt.length)return;
  undoSt.push(snap());restore(redoSt.pop());
}

/* Größe und Anzeige */
function setSize(w,h){cv.width=ov.width=Math.max(1,Math.round(w));cv.height=ov.height=Math.max(1,Math.round(h));layout()}
function layout(){
  var z=S.zoom,W=cv.width*z,H=cv.height*z;
  [cv,ov].forEach(function(e){e.style.width=W+'px';e.style.height=H+'px'});
  sheet.style.width=W+'px';sheet.style.height=H+'px';
  var ir=z>=1?'pixelated':'auto';cv.style.imageRendering=ir;ov.style.imageRendering=ir;selview.style.imageRendering=ir;
  var g=$('#grid');g.hidden=!(S.grid&&z>=4);
  if(!g.hidden){g.style.width=W+'px';g.style.height=H+'px';g.style.backgroundSize=z+'px '+z+'px'}
  $('#rhe').style.left=W+'px';$('#rhe').style.top=(H/2)+'px';
  $('#rhs').style.left=(W/2)+'px';$('#rhs').style.top=H+'px';
  $('#rhse').style.left=W+'px';$('#rhse').style.top=H+'px';
  layoutSel();layoutText();
  $('#st3').textContent=cv.width+' × '+cv.height;
}
function fitZoom(){return Math.min(1,(ws.clientWidth-34)/cv.width,(ws.clientHeight-34)/cv.height)}
function setZoom(z,center){
  commitText();
  var r=ws.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  var cx=center?center.x:((r.left+r.width/2-cr.left)/S.zoom),cy=center?center.y:((r.top+r.height/2-cr.top)/S.zoom);
  S.zoom=z;layout();
  ws.scrollLeft=Math.max(0,cx*z-ws.clientWidth/2+6);ws.scrollTop=Math.max(0,cy*z-ws.clientHeight/2+6);
  setStatus('Ansicht: '+Math.round(z*100)+' %');
}

/* Werkzeuge */
var TOOLS=[
['freeform','Freiform-Auswahl','Wählt einen frei geformten Teil des Bildes aus. Zum Verschieben, Kopieren oder Ändern.','<path d="M3 8 L7 3 L12 5 L17 3 L16 11 L12 17 L6 15 L4 11Z" fill="none" stroke="#000" stroke-dasharray="2 2"/>'],
['select','Rechteck-Auswahl','Wählt einen rechteckigen Teil des Bildes aus. An den Punkten ziehen = Größe ändern.','<rect x="3" y="4" width="14" height="12" fill="none" stroke="#000" stroke-dasharray="2 2"/>'],
['eraser','Radiergummi','Radiergummi: radiert mit der Hintergrundfarbe.','<path d="M2 12 L9 4 L18 9 L12 17 L6 17Z" fill="#f08090" stroke="#000"/><path d="M6 17 L2 12" stroke="#000"/>'],
['fill','Füllen','Füllen: auf eine Fläche tippen, um sie mit der Farbe zu füllen.','<path d="M3 11 L9 4 L16 11 L10 17Z" fill="#fff" stroke="#000"/><path d="M17 13 q2 3 0 4 q-2 -1 0 -4z" fill="#00f" stroke="#00f"/>'],
['pick','Farbe aufnehmen','Farbe aufnehmen: auf eine Stelle im Bild tippen, um deren Farbe zu verwenden.','<path d="M4 16 L11 9" stroke="#000" stroke-width="2"/><path d="M10 6 L14 10 M12 4 L16 8" stroke="#000" stroke-width="2.6"/>'],
['lupe','Lupe','Lupe: ins Bild tippen zum Vergrößern, nochmal tippen zum Verkleinern.','<circle cx="8" cy="8" r="5" fill="#cfefff" stroke="#000" stroke-width="1.6"/><path d="M12 12 L17 17" stroke="#000" stroke-width="2.6"/>'],
['pencil','Stift','Stift: zeichnet eine dünne Linie in der Farbe.','<path d="M4 17 L5 12 L14 3 L17 6 L8 15 Z" fill="#ff0" stroke="#000"/><path d="M4 17 L5 12 L8 15Z" fill="#000"/>'],
['brush','Pinsel','Pinsel: malt mit der gewählten Form und Dicke.','<path d="M4 17 q-1 -4 3 -4 l2 2 q0 3 -5 2z" fill="#000"/><path d="M9 12 L16 4" stroke="#a52a2a" stroke-width="3.2"/>'],
['spray','Spraydose','Spraydose: gedrückt halten, um Farbpunkte zu sprühen.','<rect x="5" y="9" width="7" height="8" fill="#c0c0c0" stroke="#000"/><rect x="7" y="6" width="3" height="3" fill="#000"/><circle cx="14" cy="5" r=".9"/><circle cx="17" cy="8" r=".9"/><circle cx="14" cy="8" r=".9"/><circle cx="16" cy="3" r=".9"/>'],
['text','Text','Text: ein Rechteck aufziehen oder tippen, dann schreiben. Zum Fertigstellen woanders ins Bild tippen.','<text x="10" y="16" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia,serif">A</text>'],
['line','Linie','Linie: ziehen, um eine gerade Linie zu zeichnen.','<path d="M3 17 L17 3" stroke="#000" stroke-width="2"/>'],
['curve','Kurve','Kurve: erst eine Linie ziehen, dann zweimal ziehen, um sie zu biegen.','<path d="M3 15 C6 1 12 19 17 5" fill="none" stroke="#000" stroke-width="1.8"/>'],
['rect','Rechteck','Rechteck: ziehen. Rahmen und Füllung unten wählen.','<rect x="3" y="5" width="14" height="10" fill="none" stroke="#000" stroke-width="2"/>'],
['polygon','Polygon','Polygon: erst eine Seite ziehen, dann Eckpunkte antippen. Zweimal tippen schließt die Form.','<path d="M4 15 L3 7 L9 3 L17 6 L15 16Z" fill="none" stroke="#000" stroke-width="1.8"/>'],
['ellipse','Ellipse','Ellipse: ziehen. Rahmen und Füllung unten wählen.','<ellipse cx="10" cy="10" rx="7" ry="5" fill="none" stroke="#000" stroke-width="2"/>'],
['rrect','Abgerundetes Rechteck','Abgerundetes Rechteck: ziehen. Rahmen und Füllung unten wählen.','<rect x="3" y="5" width="14" height="10" rx="4" fill="none" stroke="#000" stroke-width="2"/>']
];
function buildTools(){
  var g=$('#toolgrid');
  TOOLS.forEach(function(t){
    var b=document.createElement('button');b.type='button';b.className='tb';b.title=t[1];b.setAttribute('aria-label',t[1]);b.dataset.tool=t[0];
    b.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true">'+t[3]+'</svg>';
    b.addEventListener('click',function(){chooseTool(t[0])});g.appendChild(b);
  });
}
function chooseTool(t){
  commitText();commitPoly();cancelCurve();commitSel();
  if(t==='pick'&&S.tool!=='pick')S.prev=S.tool;
  S.tool=t;
  document.querySelectorAll('.tb').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.tool===t?'true':'false')});
  TOOLS.forEach(function(x){if(x[0]===t)setStatus(x[2])});
  cv.style.cursor=t==='text'?'text':(t==='lupe'?'zoom-in':'crosshair');
  $('#tbar').hidden=(t!=='text');
  renderOpts();
}
/* Optionen unter dem Werkzeugkasten */
var SHAPES=['rect','rrect','ellipse','polygon'];
var PRESETS={round:[3,7,12],square:[3,7,12],slash:[6,12,20],backslash:[6,12,20]};
function mk(label,pressed,html,fn){
  var b=document.createElement('button');b.type='button';b.className='ob';b.title=label;b.setAttribute('aria-label',label);
  b.setAttribute('aria-pressed',pressed?'true':'false');b.innerHTML=html;b.addEventListener('click',fn);return b;
}
function orow(n){var d=document.createElement('div');d.className='orow c'+n;return d}
function brushIcon(shape,size){
  var s=Math.min(18,size);
  if(shape==='round')return '<i style="width:'+s+'px;height:'+s+'px;border-radius:50%"></i>';
  if(shape==='square')return '<i style="width:'+s+'px;height:'+s+'px"></i>';
  var p=shape==='slash'?'M1 '+(1+s)+' L'+(1+s)+' 1':'M1 1 L'+(1+s)+' '+(1+s);
  return '<svg width="20" height="20" viewBox="0 0 20 20"><path d="'+p+'" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
}
function stepper(obj,min,max){
  var d=document.createElement('div');d.className='step';
  var m=document.createElement('button'),v=document.createElement('span'),p=document.createElement('button');
  m.type=p.type='button';m.textContent='−';p.textContent='+';m.setAttribute('aria-label','dünner');p.setAttribute('aria-label','dicker');
  v.textContent=obj.val;
  m.addEventListener('click',function(){obj.val=Math.max(min,obj.val-1);renderOpts()});
  p.addEventListener('click',function(){obj.val=Math.min(max,obj.val+1);renderOpts()});
  d.appendChild(m);d.appendChild(v);d.appendChild(p);return d;
}
function renderOpts(){
  var t=S.tool,box=$('#opts'),r;box.innerHTML='';
  if(t==='freeform'||t==='select'||t==='text'){
    r=orow(1);
    r.appendChild(mk('Deckend',!S.transparent,'<svg width="34" height="22" viewBox="0 0 34 22"><rect x="2" y="2" width="30" height="18" fill="#fff" stroke="currentColor"/><circle cx="17" cy="11" r="4" fill="#000"/></svg>',function(){S.transparent=false;optsChanged()}));
    r.appendChild(mk('Durchsichtig',S.transparent,'<svg width="34" height="22" viewBox="0 0 34 22"><rect x="2" y="2" width="30" height="18" fill="none" stroke="currentColor" stroke-dasharray="3 2"/><circle cx="17" cy="11" r="4" fill="currentColor"/></svg>',function(){S.transparent=true;optsChanged()}));
    box.appendChild(r);
  }else if(t==='eraser'){
    r=orow(2);[4,8,12,20].forEach(function(s){r.appendChild(mk('Radiergummi '+s,SZ.eraser.val===s,'<i style="width:'+Math.min(s,20)+'px;height:'+Math.min(s,20)+'px;background:#fff;outline:1px solid currentColor"></i>',function(){SZ.eraser.val=s;renderOpts()}))});

var stampCache={};

}
function walk(a,b,fn){

function drawRect(g,x0,y0,W,H,w,fc,bc,mode){

function floodFill(p,hex){
  var w=cv.width,h=cv.height,img=ctx.getImageData(0,0,w,h),d=img.data,i0=(p.y*w+p.x)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2],f=hexRgb(hex),tol=24;
  if(Math.abs(tr-f[0])+Math.abs(tg-f[1])+Math.abs(tb-f[2])<=3)return false;
  function m(i){return Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)<=tol}
  var seen=new Uint8Array(w*h),st=[p.x,p.y];
  pushUndo();
  while(st.length){
    var y=st.pop(),x=st.pop();
    if(seen[y*w+x]||!m((y*w+x)*4))continue;
    var l=x,r=x;
    while(l>0&&!seen[y*w+l-1]&&m((y*w+l-1)*4))l--;
    while(r<w-1&&!seen[y*w+r+1]&&m((y*w+r+1)*4))r++;
    for(var i=l;i<=r;i++){
      var idx=y*w+i;seen[idx]=1;d[idx*4]=f[0];d[idx*4+1]=f[1];d[idx*4+2]=f[2];d[idx*4+3]=255;
      if(y>0&&!seen[idx-w]&&m((idx-w)*4))st.push(i,y-1);
      if(y<h-1&&!seen[idx+w]&&m((idx+w)*4))st.push(i,y+1);
    }
  }
  ctx.putImageData(img,0,0);return true;
}

    ['Ja',function(){closeModal();doSave(S.name,'png').then(function(ok){if(!ok)return;if(needsGesture)modal('Paint','Gespeichert. Jetzt das Bild auswählen.',[['Auswählen …',function(){closeModal();next()}],['Abbrechen']]);else next()})}],
    ['Nein',function(){closeModal();next()}],['Abbrechen']]);
}
function helpDlg(){
  info('Hilfethemen','<p><b>Malen:</b> Werkzeug links antippen, dann mit dem Apple Pencil malen. Unter den Werkzeugen stehen Dicke und Form. Mit + und − wird es noch feiner.</p><p><b>Farben:</b> unten antippen. Lange drücken = Hintergrundfarbe. Zweimal tippen = Farbe ändern. Das Radiergummi radiert mit der Hintergrundfarbe.</p><p><b>Fehler:</b> oben rechts „Rückgängig“.</p><p><b>Bild öffnen:</b> Datei → Öffnen.</p><p><b>Mehrere Bilder einfügen:</b> Bearbeiten → Einfügen von … und mehrere Fotos auswählen. Jedes Bild erscheint mit einem Rahmen: ziehen = verschieben, an den Punkten ziehen = Größe ändern, außerhalb tippen = ablegen. Danach kommt das nächste.</p><p><b>Ausschnitt verschieben:</b> Auswahl-Werkzeug, Rechteck aufziehen, dann ziehen.</p><p><b>Zeichenfläche größer machen:</b> an den blauen Punkten rechts und unten ziehen.</p><p><b>Mit dem Stift gemalt?</b> Dann schiebt der Finger das Bild, damit die Hand aufliegen darf. Mit zwei Fingern verschiebt man immer.</p><p><b>Speichern:</b> Datei → Speichern. Das Bild bleibt außerdem automatisch auf diesem iPad erhalten.</p>');
}

/* Menüs */
function ck(b,t){return (b?'✓ ':'')+t}
function applyView(){$('#tools').hidden=!S.showTools;$('#bottom').hidden=!S.showPal;$('#status').hidden=!S.showStatus}
var menus={
  datei:function(){return [['Neu',function(){confirmSave(newDoc,false)}],['Öffnen …',function(){confirmSave(function(){openPicker('open')},true)}],['-'],['Speichern',function(){doSave(S.name,'png')}],['Speichern unter …',saveAsDlg],['Zum Sichern in Fotos zeigen …',function(){commitText();commitSel();cv.toBlob(function(b){if(b)showPhoto(b)},'image/png')}]]},
  bearbeiten:function(){var has=!!sel;return [['Rückgängig',undo,!undoSt.length],['Wiederholen',redo,!redoSt.length],['-'],['Ausschneiden',cutSel,!has],['Kopieren',copySel,!has],['Einfügen',pasteClip,!clip],['Auswahl löschen',delSel,!has],['Alles markieren',selAll],['-'],['Kopieren nach …',function(){var c=selToCanvas();if(c)saveCanvas(c,'Auswahl','png')},!has],['Einfügen von …',function(){openPicker('paste')}],['Nächstes Bild einfügen ('+pasteQueue.length+')',nextPaste,!pasteQueue.length]]},
  ansicht:function(){return [[ck(S.showTools,'Werkzeugkasten'),function(){S.showTools=!S.showTools;applyView()}],[ck(S.showPal,'Farbfeld'),function(){S.showPal=!S.showPal;applyView()}],[ck(S.showStatus,'Statusleiste'),function(){S.showStatus=!S.showStatus;applyView()}],['-'],[ck(S.zoom===1,'Zoom: Normale Größe'),function(){setZoom(1)}],[ck(S.zoom===4,'Zoom: Große Größe (400 %)'),function(){setZoom(4)}],['Zoom: Benutzerdefiniert …',zoomDlg],['Ganzes Bild zeigen',function(){setZoom(fitZoom())}],['-'],[ck(S.grid,'Raster anzeigen'),function(){S.grid=!S.grid;layout()}]]},
  bild:function(){return [['Spiegeln und Drehen …',flipRotDlg],['Strecken und Neigen …',stretchDlg],['Farben umkehren',function(){applyOp(invertC)}],['Attribute …',attrDlg],['-'],['Bild löschen',function(){commitText();cancelShapes();commitSel();pushUndo();fillWith(S.bg);touch()}]]},
  farben:function(){return [['Farben bearbeiten …',function(){editColorDlg(null)}]]},
  hilfe:function(){return [['Hilfethemen',helpDlg],['Info über Paint',function(){info('Info über Paint','Paint für das iPad.<br>Nachgebaut nach dem klassischen Paint, mit Apple Pencil bedienbar.')}]]}
};
var openMenu=null;
function closeMenu(){var d=$('#dd');d.hidden=true;d.innerHTML='';document.querySelectorAll('#menubar .open').forEach(function(b){b.classList.remove('open')});openMenu=null}
document.querySelectorAll('#menubar [data-menu]').forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.dataset.menu;if(openMenu===k){closeMenu();return}
    closeMenu();commitText();cancelCurve();openMenu=k;b.classList.add('open');
    var d=$('#dd');d.innerHTML='';
    menus[k]().forEach(function(it){
      if(it[0]==='-'){d.appendChild(document.createElement('hr'));return}
      var x=document.createElement('button');x.type='button';x.textContent=it[0];x.disabled=!!it[2];
      x.addEventListener('click',function(){closeMenu();it[1]()});d.appendChild(x);
    });
    var r=b.getBoundingClientRect();d.hidden=false;
    d.style.left=Math.max(8,Math.min(r.left,window.innerWidth-d.offsetWidth-8))+'px';d.style.top=r.bottom+'px';
  });
});
document.addEventListener('pointerdown',function(e){if(openMenu&&!e.target.closest('#dd')&&!e.target.closest('#menubar'))closeMenu()},true);
$('#undoBtn').addEventListener('click',undo);
$('#curfg').addEventListener('click',function(){S.target='fg';showColors()});
$('#curbg').addEventListener('click',function(){S.target='bg';showColors()});

/* Textleiste */
(function(){
  var ss=$('#sizesel');[8,9,10,11,12,14,16,18,20,22,24,26,28,36,48,72].forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;if(n===S.fsize)o.selected=true;ss.appendChild(o)});
  $('#fontsel').addEventListener('change',function(){S.font=this.value;styleText()});
  ss.addEventListener('change',function(){S.fsize=+this.value;styleText()});
  $('#bBold').addEventListener('click',function(){S.bold=!S.bold;styleText()});
  $('#bItal').addEventListener('click',function(){S.italic=!S.italic;styleText()});
  $('#bUnder').addEventListener('click',function(){S.under=!S.under;styleText()});
})();

/* Tastatur und Einfügen */
document.addEventListener('keydown',function(e){
  var tg=e.target;
  if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT')){if(e.key==='Escape'&&tg===tarea)commitText();return}
  if(!$('#modal').hidden)return;
  var k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
  if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(m&&k==='y'){e.preventDefault();redo()}
  else if(m&&k==='a'){e.preventDefault();selAll()}
  else if(m&&k==='c'){e.preventDefault();copySel()}
  else if(m&&k==='x'){e.preventDefault();cutSel()}
  else if(m&&k==='s'){e.preventDefault();doSave(S.name,'png')}
  else if(k==='delete'||k==='backspace'){if(sel){e.preventDefault();delSel()}}
  else if(k==='escape'){if(poly)commitPoly();cancelCurve();commitSel()}
});
document.addEventListener('paste',function(e){
  if(!$('#modal').hidden)return;var tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;
  var items=(e.clipboardData&&e.clipboardData.files)||[];
  for(var i=0;i<items.length;i++){
    if(/^image\//.test(items[i].type)){e.preventDefault();loadImg(items[i]).then(function(im){floatCanvas(imgToCanvas(im,2400),true)});return}
  }
  if(clip){e.preventDefault();pasteClip()}
});
window.addEventListener('resize',layout);

/* Start */
buildTools();buildPalette();showColors();chooseTool('pencil');applyView();
function startBlank(){
  setSize(Math.max(300,Math.floor(ws.clientWidth-34)),Math.max(240,Math.floor(ws.clientHeight-34)));S.zoom=1;layout();fillWith('#ffffff');S.dirty=false;
}
startBlank();
idbGet('img').then(function(rec){
  if(!rec||!rec.blob)return;
  var u=URL.createObjectURL(rec.blob),im=new Image();
  im.onload=function(){
    URL.revokeObjectURL(u);S.zoom=1;setSize(im.naturalWidth,im.naturalHeight);ctx.drawImage(im,0,0);
    var z=fitZoom();if(z<1){S.zoom=z;layout()}
    if(rec.name){S.name=rec.name;setTitle()}S.dirty=false;
  };
  im.onerror=function(){URL.revokeObjectURL(u)};im.src=u;
}).catch(function(){});
})();
</script>
